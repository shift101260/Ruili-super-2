<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>睿立集團｜專屬系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- 睿立集團專屬溫潤極簡風色號設定 -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ruili: {
                            bg: '#FBF9F5',       /* 主背景色：溫潤米白 / 燕麥奶色 */
                            brand: '#D4A373',    /* 主品牌色：暖焦糖棕 / 大地奶茶色 */
                            sidebar: '#2C2A29',  /* 側邊欄底色：暖木炭灰 / 深褐炭色 */
                            matcha: '#E9EDC9',   /* 輔助標籤色：柔和抹茶綠 / 灰綠色 */
                            pink: '#EED7C5',     /* 輔助強調色：柔杏粉棕 / 暖肉粉色 */
                            dark: '#292524',     /* 深色文字/邊框：深石灰 / 暖墨色 */
                            border: '#E7E5E4'    /* 淺色邊框：燕麥灰 / 暖卡其邊框 */
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-ruili-bg text-ruili-dark flex h-screen overflow-hidden font-sans">

    <!-- 側邊導覽列 (套用 #2C2A29 暖木炭灰與 #292524 深石灰邊框) -->
    <aside class="w-64 bg-ruili-sidebar text-stone-300 flex flex-col justify-between hidden md:flex border-r border-ruili-dark">
        <div>
            <!-- 品牌 Logo 與名稱 -->
            <div class="p-6 border-b border-ruili-dark flex items-center space-x-3">
                <div class="bg-ruili-brand text-white w-10 h-10 rounded-xl flex items-center justify-center font-bold text-xl shadow-xs">睿</div>
                <div>
                    <h1 class="text-white font-bold tracking-wider text-sm">睿立集團</h1>
                    <p class="text-[10px] text-stone-400">RUILI Group</p>
                </div>
            </div>
            
            <!-- 選單區域 -->
            <nav class="p-4 space-y-1.5">
            </nav>
        </div>

        <!-- 底部身分狀態 -->
        <div class="p-4 border-t border-ruili-dark text-xs text-stone-400 flex items-center justify-between">
            <span>身分：<strong>管理者</strong></span>
            <span class="inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        </div>
    </aside>

    <!-- 主畫面內容 (套用 #FBF9F5 溫潤米白底色) -->
    <main class="flex-1 flex flex-col h-full overflow-y-auto relative bg-ruili-bg">
        <div class="p-8 max-w-[96%] mx-auto w-full flex-1 space-y-6">
            
            <!-- 乾淨的主工作區 -->
            <section class="space-y-6">
                <!-- 這裡可以直接開始編排您要的內容或表格 -->
            </section>

        </div>
    </main>

</body>
</html>
