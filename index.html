<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>睿立集團｜精密營運管理與結案系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- 引入獨立的全域色號變數樣式檔 -->
    <link rel="stylesheet" href="./css/variables.css">
    <link rel="stylesheet" href="./css/layout.css">

    <!-- 讓 Tailwind 能夠抓取我們的 CSS 變數 -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ruili: {
                            bg: 'var(--ruili-bg)',
                            brand: 'var(--ruili-brand)',
                            sidebar: 'var(--ruili-sidebar)',
                            matcha: 'var(--ruili-matcha)',
                            pink: 'var(--ruili-pink)',
                            dark: 'var(--ruili-dark)',
                            border: 'var(--ruili-border)'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-ruili-bg text-ruili-dark flex h-screen overflow-hidden font-sans">

    <!-- 左側功能導覽列 -->
    <aside class="ruili-sidebar text-stone-300 flex flex-col justify-between md:flex border-r border-ruili-dark">
        <div>
            <!-- 品牌 Logo 與名稱 -->
            <div class="p-6 border-b border-ruili-dark flex items-center space-x-3 sticky top-0 bg-ruili-sidebar z-10">
                <div class="bg-ruili-brand text-white w-10 h-10 rounded-xl flex items-center justify-center font-bold text-xl shadow-xs">睿</div>
                <div>
                    <h1 class="text-white font-bold tracking-wider text-sm">睿立集團</h1>
                    <p class="text-[10px] text-stone-400">RUILI Group ERP</p>
                </div>
            </div>
            
            <!-- 功能選單 -->
            <nav id="nav-menu" class="p-4 space-y-1.5 text-xs">
                <button onclick="switchModule('dashboard', this)" class="nav-btn w-full flex items-center space-x-3 px-4 py-2.5 rounded-xl bg-ruili-brand text-white transition shadow-xs font-bold">
                    <i class="fa-solid fa-chart-line w-5"></i><span>戰情室總覽</span>
                </button>
                
                <button onclick="switchModule('kanban', this)" class="nav-btn w-full flex items-center space-x-3 px-4 py-2.5 rounded-xl hover:bg-stone-800 text-stone-300 transition">
                    <i class="fa-solid fa-list-check w-5"></i><span>工作看板</span>
                </button>

                <button onclick="switchModule('all-cases', this)" class="nav-btn w-full flex items-center space-x-3 px-4 py-2.5 rounded-xl hover:bg-stone-800 text-stone-300 transition">
                    <i class="fa-solid fa-layer-group w-5 text-amber-500"></i><span>全集團案件總覽</span>
                </button>

                <div class="pt-2 pb-1 px-3 text-[10px] font-bold uppercase tracking-wider text-stone-500">年度案件快速切換</div>
                <button onclick="switchModule('year-2027', this)" class="nav-btn w-full flex items-center space-x-3 px-4 py-2 rounded-xl hover:bg-stone-800 text-stone-300 transition"><i class="fa-solid fa-folder w-4 ml-1"></i><span>2027 案件管理</span></button>
                <button onclick="switchModule('year-2026', this)" class="nav-btn w-full flex items-center space-x-3 px-4 py-2 rounded-xl hover:bg-stone-800 text-stone-300 transition"><i class="fa-solid fa-folder w-4 ml-1"></i><span>2026 案件管理</span></button>
                <button onclick="switchModule('year-2025', this)" class="nav-btn w-full flex items-center space-x-3 px-4 py-2 rounded-xl hover:bg-stone-800 text-stone-300 transition"><i class="fa-solid fa-folder w-4 ml-1"></i><span>2025 案件管理</span></button>
                <button onclick="switchModule('year-2024', this)" class="nav-btn w-full flex items-center space-x-3 px-4 py-2 rounded-xl hover:bg-stone-800 text-stone-300 transition"><i class="fa-solid fa-folder w-4 ml-1"></i><span>2024 案件管理</span></button>
                <button onclick="switchModule('year-2023', this)" class="nav-btn w-full flex items-center space-x-3 px-4 py-2 rounded-xl hover:bg-stone-800 text-stone-300 transition"><i class="fa-solid fa-folder w-4 ml-1"></i><span>2023 案件管理</span></button>
                <button onclick="switchModule('year-2022', this)" class="nav-btn w-full flex items-center space-x-3 px-4 py-2 rounded-xl hover:bg-stone-800 text-stone-300 transition"><i class="fa-solid fa-folder w-4 ml-1"></i><span>2022 案件管理</span></button>
                <button onclick="switchModule('year-2021', this)" class="nav-btn w-full flex items-center space-x-3 px-4 py-2 rounded-xl hover:bg-stone-800 text-stone-300 transition"><i class="fa-solid fa-folder w-4 ml-1"></i><span>2021 案件管理</span></button>

                <div class="pt-2"></div>
                <button onclick="switchModule('quotation', this)" class="nav-btn w-full flex items-center space-x-3 px-4 py-2.5 rounded-xl hover:bg-stone-800 text-stone-300 transition">
                    <i class="fa-solid fa-file-invoice-dollar w-5"></i><span>報價中心</span>
                </button>
                
                <button onclick="switchModule('closing', this)" class="nav-btn w-full flex items-center space-x-3 px-4 py-2.5 rounded-xl hover:bg-stone-800 text-stone-300 transition">
                    <i class="fa-solid fa-flag-checkered w-5"></i><span>結案中心</span>
                </button>
            </nav>
        </div>

        <div class="p-4 border-t border-ruili-dark text-xs text-stone-400 flex items-center justify-between bg-ruili-sidebar">
            <span>身分：<strong>管理者</strong></span>
            <span class="inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        </div>
    </aside>

    <!-- 右側主畫面內容容器 -->
    <main class="ruili-main">
        
        <!-- 📱 手機版專屬頂部列 -->
        <div class="mobile-header-bar md:hidden flex items-center justify-between px-4 py-3 bg-[#2C2A29] text-white border-b border-[#292524]">
            <div class="flex items-center space-x-3">
                <div class="bg-[#D4A373] text-white w-8 h-8 rounded-lg flex items-center justify-center font-bold text-sm shadow-xs">睿</div>
                <span class="text-xs font-bold tracking-wider">睿立集團系統</span>
            </div>
            <button onclick="toggleSidebar()" class="text-stone-300 hover:text-white p-2 focus:outline-none">
                <i class="fa-solid fa-bars text-lg"></i>
            </button>
        </div>

        <!-- 原本的主畫面內容 -->
        <div id="app-container" class="ruili-container space-y-6">
            <div class="bg-white p-6 rounded-2xl border border-ruili-border shadow-2xs space-y-4">
                <h2 class="text-lg font-bold text-stone-900">戰情室總覽</h2>
                <p class="text-xs text-stone-500">歡迎進入睿立集團精密營運系統，請從左側切換功能或年度案件。</p>
            </div>
        </div>
    </main>

    <!-- 頁面切換與控制邏輯 -->
    <script>
        // 模擬全集團案件資料庫
        let globalCasesData = {
            '2027': [
                { id: '2027-01', name: '烏日區未來產業專區', client: '何董事長', service: '土地變更', progress: '評估中', amount: 'NT$ 3,000,000', note: '審查準備中', status: '案件評估' }
            ],
            '2026': [
                { id: '2026-01', name: '大雅區農地變更專案', client: '張先生', service: '農地變更', progress: '簽約中', amount: 'NT$ 2,500,000', note: '預計118通檢', status: '簽約案件' },
                { id: '2026-02', name: '烏日區工廠合法化', client: '黃董事長', service: '特定工廠專用區', progress: '評估中', amount: 'NT$ 2,070,000', note: '廠房打掉重蓋，太陽能自建', status: '案件評估' },
                { id: '2026-03', name: '潭子區綠能用地申設', client: '林總經理', service: '綠能申設', progress: '結案歸檔', amount: 'NT$ 1,500,000', note: '已完成全數審查', status: '結案中心' },
                { id: '2026-04', name: '西屯區資產配置顧問', client: '陳小姐', service: '資產顧問', progress: '失敗', amount: 'NT$ 0', note: '客戶端暫緩投資', status: '失敗案件' },
                { id: '2026-05', name: '北屯區土地重劃案', client: '王董', service: '土地重劃', progress: '廢件', amount: 'NT$ 0', note: '條件不符撤案', status: '廢件專區' }
            ],
            '2025': [
                { id: '2025-01', name: '潭子綠能廠房申設', client: '林總經理', service: '綠能申設', progress: '已結案', amount: 'NT$ 1,800,000', note: '完美結案', status: '結案中心' }
            ],
            '2024': [],
            '2023': [],
            '2022': [],
            '2021': []
        };

        // 🌟 打開建立新案件 Modal
        function openAddCaseModal(year) {
            const modal = document.getElementById('add-case-modal');
            if (modal) {
                modal.classList.remove('hidden');
            }
        }

        // 🌟 關閉建立新案件 Modal
        function closeAddCaseModal() {
            const modal = document.getElementById('add-case-modal');
            if (modal) {
                modal.classList.add('hidden');
            }
        }

        function switchModule(moduleName, btnElement) {
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('bg-ruili-brand', 'text-white', 'font-bold', 'shadow-xs');
                btn.classList.add('hover:bg-stone-800', 'text-stone-300');
            });
            if(btnElement) {
                btnElement.classList.remove('hover:bg-stone-800', 'text-stone-300');
                btnElement.classList.add('bg-ruili-brand', 'text-white', 'font-bold', 'shadow-xs');
            }

            const container = document.getElementById('app-container');
            
            if(moduleName === 'dashboard') {
                container.innerHTML = `
                    <div class="space-y-6">
                        <div class="bg-white p-6 rounded-2xl border border-ruili-border shadow-2xs space-y-2">
                            <h2 class="text-base font-bold text-stone-900">戰情室總覽</h2>
                            <p class="text-xs text-stone-500">掌握集團整體 YoY 財報、營運案件數與跨通路效益分析。</p>
                        </div>
                    </div>`;
            } else if(moduleName === 'kanban') {
                container.innerHTML = `
                    <div class="space-y-6">
                        <div class="bg-white p-6 rounded-2xl border border-ruili-border shadow-2xs space-y-2">
                            <h2 class="text-base font-bold text-stone-900">工作看板 SOP</h2>
                            <p class="text-xs text-stone-500">生產作業標準化流程、案件紅綠燈異常與系統推播預警。</p>
                        </div>
                    </div>`;
            } else if(moduleName === 'all-cases') {
                container.innerHTML = `
                    <div class="space-y-6">
                        <div class="bg-white p-6 rounded-2xl border border-ruili-border shadow-2xs space-y-3">
                            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                                <div>
                                    <h2 class="text-base font-bold text-stone-900">全集團案件總覽</h2>
                                    <p class="text-xs text-stone-500">跨年份集中檢索所有歷史與進行中案件，掌握全局脈動。</p>
                                </div>
                                <div class="flex items-center space-x-2">
                                    <input type="text" id="global-search-input" oninput="filterGlobalCases()" placeholder="全集團關鍵字搜尋..." class="px-3 py-1.5 text-xs border border-stone-200 rounded-xl focus:outline-none focus:border-stone-400 w-48">
                                </div>
                            </div>
                        </div>

                        <div class="bg-white rounded-2xl border border-stone-200 shadow-2xs overflow-hidden">
                            <div class="overflow-x-auto">
                                <table class="w-full text-left text-xs">
                                    <thead>
                                        <tr class="bg-stone-50/60 border-b border-stone-200 text-stone-400 font-medium">
                                            <th class="py-3 px-4">年度</th>
                                            <th class="py-3 px-4">客戶名稱</th>
                                            <th class="py-3 px-4">服務細項</th>
                                            <th class="py-3 px-4">工作進度</th>
                                            <th class="py-3 px-4">簽約金額</th>
                                            <th class="py-3 px-4">目前狀態</th>
                                        </tr>
                                    </thead>
                                    <tbody id="global-cases-tbody" class="divide-y divide-stone-100">
                                        ${renderAllCasesRows()}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>`;
            } else if(moduleName.startsWith('year-')) {
                const year = moduleName.split('-')[1];
                renderYearManagementView(year);
            } else if(moduleName === 'quotation') {
                container.innerHTML = `
                    <div class="space-y-6">
                        <div class="bg-white p-6 rounded-2xl border border-ruili-border shadow-2xs flex items-center justify-between">
                            <div>
                                <h2 class="text-base font-bold text-stone-900">報價中心</h2>
                                <p class="text-xs text-stone-500">管理各專案之官方報價單、服務計費模組與藝術預覽。</p>
                            </div>
                            <button class="px-4 py-2 bg-ruili-brand text-white rounded-xl text-xs font-bold shadow-xs hover:opacity-90 transition">+ 建立新報價</button>
                        </div>
                    </div>`;
            } else if(moduleName === 'closing') {
                container.innerHTML = `
                    <div class="space-y-6">
                        <div class="bg-white p-6 rounded-2xl border border-ruili-border shadow-2xs space-y-1.5">
                            <h2 class="text-base font-bold text-stone-900">結案中心</h2>
                            <p class="text-xs text-stone-500">所有已完成專案之 PDF 正式結案報告歸檔與歷史審查查閱。</p>
                        </div>
                    </div>`;
            }
        }

        function renderAllCasesRows() {
            let html = '';
            for (let yr in globalCasesData) {
                globalCasesData[yr].forEach(c => {
                    html += `
                        <tr class="hover:bg-stone-50/80 case-row-item" data-keyword="${c.client} ${c.name} ${c.service} ${c.note}">
                            <td class="py-3 px-4 text-stone-500 font-bold">${yr}</td>
                            <td class="py-3 px-4 text-stone-900 font-semibold">${c.client} (${c.name})</td>
                            <td class="py-3 px-4 text-stone-600">${c.service}</td>
                            <td class="py-3 px-4"><span class="px-2 py-0.5 bg-stone-100 text-stone-700 rounded-md text-[11px]">${c.progress}</span></td>
                            <td class="py-3 px-4 text-stone-900 font-bold">${c.amount}</td>
                            <td class="py-3 px-4"><span class="px-2 py-0.5 bg-blue-50 text-blue-700 border border-blue-200 rounded-md text-[11px] font-bold">${c.status}</span></td>
                        </tr>`;
                });
            }
            return html || `<tr><td colspan="6" class="py-6 text-center text-stone-400 text-xs">目前無任何案件記錄</td></tr>`;
        }

        function filterGlobalCases() {
            const keyword = document.getElementById('global-search-input').value.toLowerCase();
            const rows = document.querySelectorAll('.case-row-item');
            rows.forEach(row => {
                const text = row.getAttribute('data-keyword').toLowerCase();
                row.style.display = text.includes(keyword) ? '' : 'none';
            });
        }

        // 渲染指定年度案件管理中心（僅顯示當年度資料，搜尋也僅針對當年度）
        function renderYearManagementView(year) {
            const container = document.getElementById('app-container');
            let cases = globalCasesData[year] || [];

            const sections = [
                { key: '簽約案件', title: '簽約案件', dotColor: 'bg-blue-500', badge: 'bg-blue-50 text-blue-700 border border-blue-200' },
                { key: '案件評估', title: '案件評估', dotColor: 'bg-amber-500', badge: 'bg-amber-50 text-amber-700 border border-amber-200' },
                { key: '結案中心', title: '結案中心', dotColor: 'bg-emerald-500', badge: 'bg-emerald-50 text-emerald-700 border border-emerald-200' },
                { key: '廢件專區', title: '廢件專區', dotColor: 'bg-stone-400', badge: 'bg-stone-100 text-stone-600 border border-stone-200' },
                { key: '失敗案件', title: '失敗案件', dotColor: 'bg-rose-500', badge: 'bg-rose-50 text-rose-700 border border-rose-200' }
            ];

            let sectionsHtml = sections.map(sec => {
                let filtered = cases.filter(c => c.status === sec.key);
                
                let rowsHtml = filtered.length > 0 ? filtered.map(c => `
                    <tr class="border-b border-stone-100 hover:bg-stone-50/85 transition-colors case-row" data-keyword="${c.client} ${c.name} ${c.service} ${c.note}">
                        <td class="py-3 px-4 w-10 text-center">
                            <input type="checkbox" class="case-checkbox rounded border-stone-300 text-sky-600 focus:ring-sky-500" value="${year}:${c.id}">
                        </td>
                        <td class="py-3 px-4 text-stone-900 font-semibold">${c.client}</td>
                        <td class="py-3 px-4 text-stone-600">${c.service}</td>
                        <td class="py-3 px-4"><span class="px-2.5 py-1 bg-stone-100/80 text-stone-700 rounded-lg text-[11px] font-medium">${c.progress}</span></td>
                        <td class="py-3 px-4 text-stone-900 font-bold">${c.amount}</td>
                        <td class="py-3 px-4 text-stone-500 truncate max-w-xs">${c.note}</td>
                    </tr>
                `).join('') : `
                    <tr>
                        <td colspan="6" class="py-6 text-center text-stone-400 text-xs">目前無相關案件記錄</td>
                    </tr>
                `;

                return `
                    <div class="bg-white rounded-2xl border border-stone-200 shadow-2xs overflow-hidden mb-6 section-card" data-section="${sec.key}">
                        <div class="px-6 py-3.5 bg-stone-50/60 border-b border-stone-200 flex items-center justify-between">
                            <div class="font-bold text-xs text-stone-800 flex items-center space-x-2.5">
                                <span class="w-2.5 h-2.5 rounded-full ${sec.dotColor}"></span>
                                <span class="tracking-wide">${sec.title}</span>
                            </div>
                            <span class="px-2.5 py-0.5 rounded-md text-[11px] font-bold ${sec.badge} section-badge">${filtered.length} 件</span>
                        </div>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left text-xs">
                                <thead>
                                    <tr class="bg-white border-b border-stone-100 text-stone-400 font-medium">
                                        <th class="py-2.5 px-4 w-10 text-center"><input type="checkbox" onclick="toggleSelectAll(this, '${sec.key}')" class="rounded border-stone-300"></th>
                                        <th class="py-2.5 px-4">客戶名稱</th>
                                        <th class="py-2.5 px-4">服務細項</th>
                                        <th class="py-2.5 px-4">工作進度</th>
                                        <th class="py-2.5 px-4">簽約金額</th>
                                        <th class="py-2.5 px-4">案件即時說明</th>
                                    </tr>
                                </thead>
                                <tbody class="section-tbody-${sec.key}">
                                    ${rowsHtml}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            }).join('');

            container.innerHTML = `
                <div class="space-y-6">
                    <!-- 頂部工具列：當年度關鍵字搜尋、新增、刪除、恢復、拋轉 -->
                    <div class="bg-white p-5 rounded-2xl border border-ruili-border shadow-2xs flex flex-col md:flex-row md:items-center justify-between gap-4">
                        <div>
                            <h2 class="text-base font-bold text-stone-950">${year} 年度案件管理中心</h2>
                            <p class="text-xs text-stone-500">僅顯示與管理 ${year} 年度之案件，支援當年度關鍵字搜尋、勾選、刪除、恢復與狀態拋轉。</p>
                        </div>
                        <div class="flex flex-wrap items-center gap-2">
                            <!-- 當年度關鍵字搜尋框 -->
                            <div class="relative">
                                <input type="text" id="year-search-input" oninput="filterCurrentYearManagement()" placeholder="搜尋 ${year} 年度案件..." class="px-3 py-1.5 pl-8 text-xs border border-stone-200 rounded-xl focus:outline-none focus:border-stone-400 w-48">
                                <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-stone-400 text-[10px]"></i>
                            </div>
                            <!-- 新增按鈕 -->
                            <button onclick="openAddCaseModal('${year}')" class="px-3 py-1.5 bg-sky-600 hover:bg-sky-700 text-white rounded-xl text-xs font-bold transition flex items-center gap-1 shadow-xs">
                                <i class="fa-solid fa-plus text-[10px]"></i> 新增
                            </button>
                            <!-- 刪除按鈕 -->
                            <button onclick="handleDeleteSelected('${year}')" class="px-3 py-1.5 bg-stone-100 hover:bg-rose-50 text-stone-700 hover:text-rose-600 border border-stone-200 rounded-xl text-xs font-bold transition flex items-center gap-1">
                                <i class="fa-solid fa-trash-can text-[10px]"></i> 刪除
                            </button>
                            <!-- 恢復按鈕 -->
                            <button onclick="handleRestoreSelected('${year}')" class="px-3 py-1.5 bg-stone-100 hover:bg-emerald-50 text-stone-700 hover:text-emerald-600 border border-stone-200 rounded-xl text-xs font-bold transition flex items-center gap-1">
                                <i class="fa-solid fa-rotate-left text-[10px]"></i> 恢復
                            </button>
                            <!-- 案件拋轉下拉選單 -->
                            <select id="transfer-target-select" onchange="handleTransferSelected(this, '${year}')" class="px-3 py-1.5 text-xs border border-stone-300 rounded-xl bg-slate-50 font-bold text-stone-700 focus:outline-none focus:border-sky-500 shadow-xs">
                                <option value="">-- 案件拋轉至 --</option>
                                <option value="簽約案件">簽約案件</option>
                                <option value="案件評估">案件評估</option>
                                <option value="結案中心">結案中心</option>
                                <option value="廢件專區">廢件專區</option>
                                <option value="失敗案件">失敗案件</option>
                            </select>
                        </div>
                    </div>

                    <!-- 垂直區塊列表 -->
                    <div class="space-y-6">
                        ${sectionsHtml}
                    </div>
                </div>
            `;
        }

        // 當年度案件管理中的即時關鍵字搜尋過濾
        function filterCurrentYearManagement() {
            const keyword = document.getElementById('year-search-input').value.toLowerCase();
            const rows = document.querySelectorAll('.case-row');
            
            rows.forEach(row => {
                const text = row.getAttribute('data-keyword').toLowerCase();
                if(text.includes(keyword)) {
                    row.style.display = '';
                } else {
                    row.style.display = 'none';
                }
            });
        }

        // 全選 / 取消全選該區塊
        function toggleSelectAll(masterCheckbox, sectionKey) {
            const tbody = document.querySelector(`.section-tbody-${sectionKey}`);
            if(!tbody) return;
            const checkboxes = tbody.querySelectorAll('.case-checkbox');
            checkboxes.forEach(cb => cb.checked = masterCheckbox.checked);
        }

        // 刪除勾選案件
        function handleDeleteSelected(currentYear) {
            const checkedBoxes = document.querySelectorAll('.case-checkbox:checked');
            if(checkedBoxes.length === 0) {
                alert('請先勾選要刪除的案件！');
                return;
            }
            if(!confirm(`確定要刪除選中的 ${checkedBoxes.length} 筆案件嗎？`)) return;

            checkedBoxes.forEach(cb => {
                const [yr, id] = cb.value.split(':');
                if(globalCasesData[yr]) {
                    globalCasesData[yr] = globalCasesData[yr].filter(c => c.id !== id);
                }
            });
            
            alert('已成功刪除勾選案件！');
            renderYearManagementView(currentYear);
        }

        // 恢復勾選案件
        function handleRestoreSelected(currentYear) {
            const checkedBoxes = document.querySelectorAll('.case-checkbox:checked');
            if(checkedBoxes.length === 0) {
                alert('請先勾選要恢復的案件！');
                return;
            }
            checkedBoxes.forEach(cb => {
                const [yr, id] = cb.value.split(':');
                if(globalCasesData[yr]) {
                    globalCasesData[yr].forEach(c => {
                        if(c.id === id) c.status = '案件評估';
                    });
                }
            });
            alert('已成功將勾選案件恢復至「案件評估」！');
            renderYearManagementView(currentYear);
        }

        // 案件拋轉（同年度內部各狀態區塊拋轉）
        function handleTransferSelected(selectElement, currentYear) {
            const targetStatus = selectElement.value;
            if(!targetStatus) return;

            const checkedBoxes = document.querySelectorAll('.case-checkbox:checked');
            if(checkedBoxes.length === 0) {
                alert('請先勾選要拋轉的案件！');
                selectElement.value = '';
                return;
            }

            if(!confirm(`確定要將選中的 ${checkedBoxes.length} 筆案件拋轉至【${targetStatus}】嗎？`)) {
                selectElement.value = '';
                return;
            }

            checkedBoxes.forEach(cb => {
                const [yr, id] = cb.value.split(':');
                if(globalCasesData[yr]) {
                    globalCasesData[yr].forEach(c => {
                        if(c.id === id) c.status = targetStatus;
                    });
                }
            });

            alert(`成功將案件拋轉至「${targetStatus}」！`);
            renderYearManagementView(currentYear);
        }

        // 控制手機版側邊欄開關的函式
        function toggleSidebar() {
            const sidebar = document.querySelector('.ruili-sidebar');
            sidebar.classList.toggle('mobile-open');
        }

        // 預設載入時顯示 2026 年度案件管理
        window.onload = function() {
            const defaultBtn = document.querySelector("button[onclick*='year-2026']");
            switchModule('year-2026', defaultBtn);
        };
    </script>
</body>
</html>
