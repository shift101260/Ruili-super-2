<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>睿立集團｜系統開發底版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#FBF9F5] text-stone-800 flex flex-col h-screen overflow-hidden font-sans">

    <!-- 主工作區容器 -->
    <main class="flex-1 flex flex-col h-full overflow-y-auto p-6 md:p-10">
        <div class="max-w-[96%] mx-auto w-full flex-1 space-y-6">
            
            <!-- 看板 / 區塊主體 -->
            <section class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-4 gap-5 pt-2">
                    
                    <!-- 欄位 1 -->
                    <div class="bg-[#F4F1EA] p-4 rounded-2xl border border-stone-300/60 space-y-4 flex flex-col min-h-[400px]">
                        <div class="flex justify-between items-center font-bold text-xs text-stone-700 px-1 uppercase tracking-wider">
                            <span><i class="fa-solid fa-folder-open text-[#D4A373] mr-1.5"></i> 區塊一</span>
                        </div>
                        <div class="space-y-3 flex-1">
                            <!-- 這裡可放置您的卡片或內容 -->
                        </div>
                    </div>

                    <!-- 欄位 2 -->
                    <div class="bg-[#F4F1EA] p-4 rounded-2xl border border-stone-300/60 space-y-4 flex flex-col min-h-[400px]">
                        <div class="flex justify-between items-center font-bold text-xs text-stone-700 px-1 uppercase tracking-wider">
                            <span><i class="fa-solid fa-folder-open text-[#D4A373] mr-1.5"></i> 區塊二</span>

                        <div class="space-y-3 flex-1">

                    </div>

                    <!-- 欄位 3 -->

                        <div class="flex justify-between items-center font-bold text-xs text-stone-700 px-1 uppercase tracking-wider">
                            <span><i class="fa-solid fa-folder-open text-[#D4A373] mr-1.5"></i> 區塊三</span>
                        </div>
                        <div class="space-y-3 flex-1">
                            <!-- 這裡可放置您的卡片或內容 -->
                        </div>
                    </div>

                    <!-- 欄位 4 -->
                    <div class="bg-[#F4F1EA] p-4 rounded-2xl border border-stone-300/60 space-y-4 flex flex-col min-h-[400px]">
                        <div class="flex justify-between items-center font-bold text-xs text-stone-700 px-1 uppercase tracking-wider">
                            <span><i class="fa-solid fa-folder-open text-[#D4A373] mr-1.5"></i> 區塊四</span>
                        </div>
                        <div class="space-y-3 flex-1">
                            <!-- 這裡可放置您的卡片或內容 -->
                        </div>
                    </div>

                </div>
            </section>

        </div>
    </main>

</body>
