<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>睿立集團｜專屬系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#FBF9F5] text-stone-800 flex h-screen overflow-hidden font-sans">

    <!-- 側邊導覽列 (黑底與睿立集團識別) -->
    <aside class="w-64 bg-[#2C2A29] text-stone-300 flex flex-col justify-between hidden md:flex border-r border-stone-800">
        <div>
            <!-- 品牌 Logo 與名稱 -->
            <div class="p-6 border-b border-stone-800 flex items-center space-x-3">
                <div class="bg-[#D4A373] text-white w-10 h-10 rounded-xl flex items-center justify-center font-bold text-xl shadow-xs">睿</div>
                <div>
                    <h1 class="text-white font-bold tracking-wider text-sm">睿立集團</h1>
                    <p class="text-[10px] text-stone-400">RUILI PRECISION ERP</p>
                </div>
            </div>
            
            <!-- 選單區域 -->
            <nav class="p-4 space-y-1.5">
            </nav>
        </div>

        <!-- 底部身分狀態 -->
        <div class="p-4 border-t border-stone-800 text-xs text-stone-400 flex items-center justify-between">
            <span>身分：<strong>管理者</strong></span>
            <span class="inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        </div>
    </aside>

    <!-- 主畫面內容 -->
    <main class="flex-1 flex flex-col h-full overflow-y-auto relative">
        <div class="p-8 max-w-[96%] mx-auto w-full flex-1 space-y-6">
            
            <!-- 乾淨的主工作區 -->
            <section class="space-y-6">
                <!-- 這裡可以直接開始編排您要的內容或表格 -->
            </section>

        </div>
    </main>

</body>
</html>
