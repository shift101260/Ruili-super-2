<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>睿立集團｜精密營運管理與結案系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- 溫潤極簡風專屬色號設定 -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ruili: {
                            bg: '#FBF9F5',       /* 主背景色：溫潤米白 */
                            brand: '#D4A373',    /* 主品牌色：暖焦糖棕 */
                            sidebar: '#2C2A29',  /* 側邊欄底色：暖木炭灰 */
                            matcha: '#E9EDC9',   /* 輔助標籤色：柔和抹茶綠 */
                            pink: '#EED7C5',     /* 輔助強調色：柔杏粉棕 */
                            dark: '#292524',     /* 深色文字/邊框：深石灰 */
                            border: '#E7E5E4'    /* 淺色邊框：燕麥灰 */
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-ruili-bg text-ruili-dark flex h-screen overflow-hidden font-sans">

    <!-- 左側功能導覽列 -->
    <aside class="w-64 bg-ruili-sidebar text-stone-300 flex flex-col justify-between hidden md:flex border-r border-ruili-dark overflow-y-auto">
        <div>
            <!-- 品牌 Logo 與名稱 -->
            <div class="p-6 border-b border-ruili-dark flex items-center space-x-3 sticky top-0 bg-ruili-sidebar z-10">
                <div class="bg-ruili-brand text-white w-10 h-10 rounded-xl flex items-center justify-center font-bold text-xl shadow-xs">睿</div>
                <div>
                    <h1 class="text-white font-bold tracking-wider text-sm">睿立集團</h1>
                    <p class="text-[10px] text-stone-400">RUILI Group ERP</p>
                </div>
            </div>
            
            <!-- 功能選單 -->
            <nav id="nav-menu" class="p-4 space-y-1.5 text-xs">
                <button onclick="switchModule('dashboard', this)" class="nav-btn w-full flex items-center space-x-3 px-4 py-2.5 rounded-xl bg-ruili-brand text-white transition shadow-xs font-bold">
                    <i class="fa-solid fa-chart-line w-5"></i><span>戰情室總覽</span>
                </button>
                
                <button onclick="switchModule('kanban', this)" class="nav-btn w-full flex items-center space-x-3 px-4 py-2.5 rounded-xl hover:bg-stone-800 text-stone-300 transition">
                    <i class="fa-solid fa-list-check w-5"></i><span>工作看板</span>
                </button>

                <!-- 年度案件管理群組 -->
                <div class="pt-2 pb-1 px-3 text-[10px] font-bold uppercase tracking-wider text-stone-500">年度案件管理</div>
                <button onclick="switchModule('year-2027', this)" class="nav-btn w-full flex items-center space-x-3 px-4 py-2 rounded-xl hover:bg-stone-800 text-stone-300 transition"><i class="fa-solid fa-folder w-4 ml-1"></i><span>2027 案件管理</span></button>
                <button onclick="switchModule('year-2026', this)" class="nav-btn w-full flex items-center space-x-3 px-4 py-2 rounded-xl hover:bg-stone-800 text-stone-300 transition"><i class="fa-solid fa-folder w-4 ml-1"></i><span>2026 案件管理</span></button>
                <button onclick="switchModule('year-2025', this)" class="nav-btn w-full flex items-center space-x-3 px-4 py-2 rounded-xl hover:bg-stone-800 text-stone-300 transition"><i class="fa-solid fa-folder w-4 ml-1"></i><span>2025 案件管理</span></button>
                <button onclick="switchModule('year-2024', this)" class="nav-btn w-full flex items-center space-x-3 px-4 py-2 rounded-xl hover:bg-stone-800 text-stone-300 transition"><i class="fa-solid fa-folder w-4 ml-1"></i><span>2024 案件管理</span></button>
                <button onclick="switchModule('year-2023', this)" class="nav-btn w-full flex items-center space-x-3 px-4 py-2 rounded-xl hover:bg-stone-800 text-stone-300 transition"><i class="fa-solid fa-folder w-4 ml-1"></i><span>2023 案件管理</span></button>
                <button onclick="switchModule('year-2022', this)" class="nav-btn w-full flex items-center space-x-3 px-4 py-2 rounded-xl hover:bg-stone-800 text-stone-300 transition"><i class="fa-solid fa-folder w-4 ml-1"></i><span>2022 案件管理</span></button>
                <button onclick="switchModule('year-2021', this)" class="nav-btn w-full flex items-center space-x-3 px-4 py-2 rounded-xl hover:bg-stone-800 text-stone-300 transition"><i class="fa-solid fa-folder w-4 ml-1"></i><span>2021 案件管理</span></button>

                <div class="pt-2"></div>
                <button onclick="switchModule('quotation', this)" class="nav-btn w-full flex items-center space-x-3 px-4 py-2.5 rounded-xl hover:bg-stone-800 text-stone-300 transition">
                    <i class="fa-solid fa-file-invoice-dollar w-5"></i><span>報價中心</span>
                </button>
                
                <button onclick="switchModule('closing', this)" class="nav-btn w-full flex items-center space-x-3 px-4 py-2.5 rounded-xl hover:bg-stone-800 text-stone-300 transition">
                    <i class="fa-solid fa-flag-checkered w-5"></i><span>結案中心</span>
                </button>
            </nav>
        </div>

        <!-- 底部身分狀態 -->
        <div class="p-4 border-t border-ruili-dark text-xs text-stone-400 flex items-center justify-between bg-ruili-sidebar">
            <span>身分：<strong>管理者</strong></span>
            <span class="inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        </div>
    </aside>

    <!-- 右側主畫面內容容器 -->
    <main class="flex-1 flex flex-col h-full overflow-y-auto relative bg-ruili-bg">
        <div id="app-container" class="p-8 max-w-[96%] mx-auto w-full flex-1 space-y-6">
            <!-- 預設載入戰情室 -->
            <div class="bg-white p-6 rounded-2xl border border-ruili-border shadow-2xs space-y-4">
                <h2 class="text-lg font-bold text-stone-900">戰情室總覽</h2>
                <p class="text-xs text-stone-500">歡迎進入睿立集團精密營運系統，請從左側切換功能或年度案件。</p>
            </div>
        </div>
    </main>

    <!-- 互動邏輯與動態渲染 -->
    <script>
        function switchModule(moduleName, btnElement) {
            // 切換按鈕樣式
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('bg-ruili-brand', 'text-white', 'font-bold', 'shadow-xs');
                btn.classList.add('hover:bg-stone-800', 'text-stone-300');
            });
            if(btnElement) {
                btnElement.classList.remove('hover:bg-stone-800', 'text-stone-300');
                btnElement.classList.add('bg-ruili-brand', 'text-white', 'font-bold', 'shadow-xs');
            }

            const container = document.getElementById('app-container');
            
            if(moduleName === 'dashboard') {
                container.innerHTML = `
                    <div class="bg-white p-6 rounded-2xl border border-ruili-border shadow-2xs space-y-4">
                        <h2 class="text-lg font-bold">戰情室總覽</h2>
                        <p class="text-xs text-stone-500">包含 YoY 財報、案件數、簽約金額與業務通路效益分析。</p>
                    </div>`;
            } else if(moduleName === 'kanban') {
                container.innerHTML = `
                    <div class="bg-white p-6 rounded-2xl border border-ruili-border shadow-2xs space-y-4">
                        <h2 class="text-lg font-bold">工作看板 SOP</h2>
                        <p class="text-xs text-stone-500">生產作業流程、推播、紅綠燈與 NAS 日期管控。</p>
                    </div>`;
            } else if(moduleName.startsWith('year-')) {
                const year = moduleName.split('-')[1];
                // 渲染由上到下的五大分類區塊
                container.innerHTML = `
                    <div class="space-y-6">
                        <!-- 頁面標題列 -->
                        <div class="flex justify-between items-center bg-white p-6 rounded-2xl border border-ruili-border shadow-2xs">
                            <div>
                                <h2 class="text-lg font-bold text-stone-900"><i class="fa-solid fa-folder-tree text-ruili-brand mr-2"></i> ${year} 年度案件管理中心</h2>
                                <p class="text-xs text-stone-500 mt-0.5">垂直分層管理該年度所有專案生命週期（簽約、評估、結案、廢件、失敗）</p>
                            </div>
                            <button onclick="alert('開啟新增 ${year} 年度案件表單')" class="bg-ruili-brand hover:bg-[#C28E5F] text-white px-4 py-2 rounded-xl text-xs font-bold transition shadow-2xs">
                                <i class="fa-solid fa-plus mr-1"></i> 建立新案件
                            </button>
                        </div>

                        <!-- 1. 簽約案件區塊 -->
                        <div class="bg-white p-6 rounded-2xl border border-ruili-border shadow-2xs space-y-4">
                            <div class="flex items-center justify-between border-b border-stone-100 pb-3">
                                <h3 class="font-bold text-sm text-stone-900 flex items-center"><i class="fa-solid fa-file-signature text-amber-600 mr-2"></i> 1. 簽約案件 (Active Contracts)</h3>
                                <span class="text-xs bg-amber-50 text-amber-800 px-2.5 py-1 rounded-full font-semibold border border-amber-200">進行中</span>
                            </div>
                            <div class="p-4 bg-stone-50 rounded-xl border border-stone-100 text-xs text-stone-500 text-center py-6">
                                尚無進行中的簽約案件，點擊上方「建立新案件」開始新增。
                            </div>
                        </div>

                        <!-- 2. 案件評估區塊 -->
                        <div class="bg-white p-6 rounded-2xl border border-ruili-border shadow-2xs space-y-4">
                            <div class="flex items-center justify-between border-b border-stone-100 pb-3">
                                <h3 class="font-bold text-sm text-stone-900 flex items-center"><i class="fa-solid fa-magnifying-glass-chart text-blue-600 mr-2"></i> 2. 案件評估 (Evaluation & Assessment)</h3>
                                <span class="text-xs bg-blue-50 text-blue-800 px-2.5 py-1 rounded-full font-semibold border border-blue-200">評估中 / 試算中</span>
                            </div>
                            <div class="p-4 bg-stone-50 rounded-xl border border-stone-100 text-xs text-stone-500 text-center py-6">
                                包含土地基本資料、建物、太陽能與補照試算評估中案件。
                            </div>
                        </div>

                        <!-- 3. 結案區塊 -->
                        <div class="bg-white p-6 rounded-2xl border border-ruili-border shadow-2xs space-y-4">
                            <div class="flex items-center justify-between border-b border-stone-100 pb-3">
                                <h3 class="font-bold text-sm text-stone-900 flex items-center"><i class="fa-solid fa-flag-checkered text-emerald-600 mr-2"></i> 3. 結案區 (Completed Cases)</h3>
                                <span class="text-xs bg-emerald-50 text-emerald-800 px-2.5 py-1 rounded-full font-semibold border border-emerald-200">已圓滿結案</span>
                            </div>
                            <div class="p-4 bg-stone-50 rounded-xl border border-stone-100 text-xs text-stone-500 text-center py-6">
                                已完成領證、尾款結清與 PDF 歸檔之歷史案件。
                            </div>
                        </div>

                        <!-- 4. 廢件區塊 -->
                        <div class="bg-white p-6 rounded-2xl border border-ruili-border shadow-2xs space-y-4">
                            <div class="flex items-center justify-between border-b border-stone-100 pb-3">
                                <h3 class="font-bold text-sm text-stone-900 flex items-center"><i class="fa-solid fa-box-archive text-stone-500 mr-2"></i> 4. 廢件區 (Archived / Dropped)</h3>
                                <span class="text-xs bg-stone-100 text-stone-600 px-2.5 py-1 rounded-full font-semibold border border-stone-200">已撤回 / 暫停</span>
                            </div>
                            <div class="p-4 bg-stone-50 rounded-xl border border-stone-100 text-xs text-stone-500 text-center py-6">
                                因客戶端因素暫停或主動撤回之案件。
                            </div>
                        </div>

                        <!-- 5. 案件失敗區塊 -->
                        <div class="bg-white p-6 rounded-2xl border border-ruili-border shadow-2xs space-y-4">
                            <div class="flex items-center justify-between border-b border-stone-100 pb-3">
                                <h3 class="font-bold text-sm text-stone-900 flex items-center"><i class="fa-solid fa-circle-xmark text-red-600 mr-2"></i> 5. 案件失敗 (Failed / Rejected)</h3>
                                <span class="text-xs bg-red-50 text-red-700 px-2.5 py-1 rounded-full font-semibold border border-red-200">未通過 / 駁回</span>
                            </div>
                            <div class="p-4 bg-stone-50 rounded-xl border border-stone-100 text-xs text-stone-500 text-center py-6">
                                審查未過、未簽約原因追蹤與未成交案件歸檔。
                            </div>
                        </div>
                    </div>
                `;
            } else if(moduleName === 'quotation') {
                container.innerHTML = `
                    <div class="bg-white p-6 rounded-2xl border border-ruili-border shadow-2xs space-y-4">
                        <h2 class="text-lg font-bold">報價中心</h2>
                        <p class="text-xs text-stone-500">檢視與列印專案報價單。</p>
                    </div>`;
            } else if(moduleName === 'closing') {
                container.innerHTML = `
                    <div class="bg-white p-6 rounded-2xl border border-ruili-border shadow-2xs space-y-4">
                        <h2 class="text-lg font-bold">結案中心</h2>
                        <p class="text-xs text-stone-500">檢視與導出專案正式結案報告 PDF。</p>
                    </div>`;
            }
        }
    </script>
</body>
</html>
