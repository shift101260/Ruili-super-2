<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>睿立集團｜精密營運管理與結案系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- 引入獨立的全域色號變數樣式檔 -->
    <link rel="stylesheet" href="./css/variables.css">
    <link rel="stylesheet" href="./css/layout.css">

    <!-- 讓 Tailwind 能夠抓取我們的 CSS 變數 -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ruili: {
                            bg: 'var(--ruili-bg)',
                            brand: 'var(--ruili-brand)',
                            sidebar: 'var(--ruili-sidebar)',
                            matcha: 'var(--ruili-matcha)',
                            pink: 'var(--ruili-pink)',
                            dark: 'var(--ruili-dark)',
                            border: 'var(--ruili-border)'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-ruili-bg text-ruili-dark flex h-screen overflow-hidden font-sans">

    <!-- 左側功能導覽列 -->
    <aside class="ruili-sidebar text-stone-300 flex flex-col justify-between hidden md:flex border-r border-ruili-dark">
        <div>
            <!-- 品牌 Logo 與名稱 -->
            <div class="p-6 border-b border-ruili-dark flex items-center space-x-3 sticky top-0 bg-ruili-sidebar z-10">
                <div class="bg-ruili-brand text-white w-10 h-10 rounded-xl flex items-center justify-center font-bold text-xl shadow-xs">睿</div>
                <div>
                    <h1 class="text-white font-bold tracking-wider text-sm">睿立集團</h1>
                    <p class="text-[10px] text-stone-400">RUILI Group ERP</p>
                </div>
            </div>
            
            <!-- 功能選單 -->
            <nav id="nav-menu" class="p-4 space-y-1.5 text-xs">
                <button onclick="switchModule('dashboard', this)" class="nav-btn w-full flex items-center space-x-3 px-4 py-2.5 rounded-xl bg-ruili-brand text-white transition shadow-xs font-bold">
                    <i class="fa-solid fa-chart-line w-5"></i><span>戰情室總覽</span>
                </button>
                
                <button onclick="switchModule('kanban', this)" class="nav-btn w-full flex items-center space-x-3 px-4 py-2.5 rounded-xl hover:bg-stone-800 text-stone-300 transition">
                    <i class="fa-solid fa-list-check w-5"></i><span>工作看板</span>
                </button>

                <button onclick="switchModule('all-cases', this)" class="nav-btn w-full flex items-center space-x-3 px-4 py-2.5 rounded-xl hover:bg-stone-800 text-stone-300 transition">
                    <i class="fa-solid fa-layer-group w-5 text-amber-500"></i><span>全集團案件總覽</span>
                </button>

                <div class="pt-2 pb-1 px-3 text-[10px] font-bold uppercase tracking-wider text-stone-500">年度案件快速切換</div>
                <button onclick="switchModule('year-2027', this)" class="nav-btn w-full flex items-center space-x-3 px-4 py-2 rounded-xl hover:bg-stone-800 text-stone-300 transition"><i class="fa-solid fa-folder w-4 ml-1"></i><span>2027 案件管理</span></button>
                <button onclick="switchModule('year-2026', this)" class="nav-btn w-full flex items-center space-x-3 px-4 py-2 rounded-xl hover:bg-stone-800 text-stone-300 transition"><i class="fa-solid fa-folder w-4 ml-1"></i><span>2026 案件管理</span></button>
                <button onclick="switchModule('year-2025', this)" class="nav-btn w-full flex items-center space-x-3 px-4 py-2 rounded-xl hover:bg-stone-800 text-stone-300 transition"><i class="fa-solid fa-folder w-4 ml-1"></i><span>2025 案件管理</span></button>
                <button onclick="switchModule('year-2024', this)" class="nav-btn w-full flex items-center space-x-3 px-4 py-2 rounded-xl hover:bg-stone-800 text-stone-300 transition"><i class="fa-solid fa-folder w-4 ml-1"></i><span>2024 案件管理</span></button>
                <button onclick="switchModule('year-2023', this)" class="nav-btn w-full flex items-center space-x-3 px-4 py-2 rounded-xl hover:bg-stone-800 text-stone-300 transition"><i class="fa-solid fa-folder w-4 ml-1"></i><span>2023 案件管理</span></button>
                <button onclick="switchModule('year-2022', this)" class="nav-btn w-full flex items-center space-x-3 px-4 py-2 rounded-xl hover:bg-stone-800 text-stone-300 transition"><i class="fa-solid fa-folder w-4 ml-1"></i><span>2022 案件管理</span></button>
                <button onclick="switchModule('year-2021', this)" class="nav-btn w-full flex items-center space-x-3 px-4 py-2 rounded-xl hover:bg-stone-800 text-stone-300 transition"><i class="fa-solid fa-folder w-4 ml-1"></i><span>2021 案件管理</span></button>

                <div class="pt-2"></div>
                <button onclick="switchModule('quotation', this)" class="nav-btn w-full flex items-center space-x-3 px-4 py-2.5 rounded-xl hover:bg-stone-800 text-stone-300 transition">
                    <i class="fa-solid fa-file-invoice-dollar w-5"></i><span>報價中心</span>
                </button>
                
                <button onclick="switchModule('closing', this)" class="nav-btn w-full flex items-center space-x-3 px-4 py-2.5 rounded-xl hover:bg-stone-800 text-stone-300 transition">
                    <i class="fa-solid fa-flag-checkered w-5"></i><span>結案中心</span>
                </button>
            </nav>
        </div>

        <div class="p-4 border-t border-ruili-dark text-xs text-stone-400 flex items-center justify-between bg-ruili-sidebar">
            <span>身分：<strong>管理者</strong></span>
            <span class="inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        </div>
    <!-- 右側主畫面內容容器 -->
<main class="ruili-main">
    
    <!-- 📱 手機版專屬頂部列 (只有在手機螢幕才會顯示) -->
    <div class="mobile-header-bar md:hidden flex items-center justify-between px-4 py-3 bg-[#2C2A29] text-white border-b border-[#292524]">
    <!-- 左側：Logo 與名稱 -->
    <div class="flex items-center space-x-3">
        <div class="bg-[#D4A373] text-white w-8 h-8 rounded-lg flex items-center justify-center font-bold text-sm shadow-xs">睿</div>
        <span class="text-xs font-bold tracking-wider">睿立集團系統</span>
    </div>
    <!-- 右側：漢堡選單按鈕 -->
    <button onclick="toggleMobileSidebar()" class="text-stone-300 hover:text-white p-2 focus:outline-none">
        <i class="fa-solid fa-bars text-lg"></i>
    </button>
</div>

    <!-- 原本的主畫面內容 -->
    <div id="app-container" class="ruili-container space-y-6">
        <div class="bg-white p-6 rounded-2xl border border-ruili-border shadow-2xs space-y-4">
            <h2 class="text-lg font-bold text-stone-900">戰情室總覽</h2>
            <p class="text-xs text-stone-500">歡迎進入睿立集團精密營運系統，請從左側切換功能或年度案件。</p>
        </div>
    </div>
</main>

    <!-- 頁面切換控制邏輯 -->
    <script>
        function switchModule(moduleName, btnElement) {
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('bg-ruili-brand', 'text-white', 'font-bold', 'shadow-xs');
                btn.classList.add('hover:bg-stone-800', 'text-stone-300');
            });
            if(btnElement) {
                btnElement.classList.remove('hover:bg-stone-800', 'text-stone-300');
                btnElement.classList.add('bg-ruili-brand', 'text-white', 'font-bold', 'shadow-xs');
            }

            const container = document.getElementById('app-container');
            
            if(moduleName === 'dashboard') {
                container.innerHTML = `<div class="bg-white p-6 rounded-2xl border border-ruili-border shadow-2xs space-y-4"><h2 class="text-lg font-bold">戰情室總覽</h2><p class="text-xs text-stone-500">包含 YoY 財報、案件數與通路效益分析。</p></div>`;
            } else if(moduleName === 'kanban') {
                container.innerHTML = `<div class="bg-white p-6 rounded-2xl border border-ruili-border shadow-2xs space-y-4"><h2 class="text-lg font-bold">工作看板 SOP</h2><p class="text-xs text-stone-500">生產作業流程、紅綠燈與推播預警。</p></div>`;
            } else if(moduleName === 'all-cases') {
                container.innerHTML = `<div class="bg-white p-6 rounded-2xl border border-ruili-border shadow-2xs space-y-4"><h2 class="text-lg font-bold">全集團案件總覽</h2><p class="text-xs text-stone-500">跨年份集中檢索所有歷史與進行中案件。</p></div>`;
            } else if(moduleName.startsWith('year-')) {
                const year = moduleName.split('-')[1];
                container.innerHTML = `<div class="bg-white p-6 rounded-2xl border border-ruili-border shadow-2xs space-y-4"><h2 class="text-lg font-bold">${year} 年度案件管理中心</h2><p class="text-xs text-stone-500">包含簽約、評估、結案、廢件、失敗五大垂直區塊。</p></div>`;
            } else if(moduleName === 'quotation') {
                container.innerHTML = `<div class="bg-white p-6 rounded-2xl border border-ruili-border shadow-2xs space-y-4"><h2 class="text-lg font-bold">報價中心</h2><p class="text-xs text-stone-500">報價單與報價藝術預覽。</p></div>`;
            } else if(moduleName === 'closing') {
                container.innerHTML = `<div class="bg-white p-6 rounded-2xl border border-ruili-border shadow-2xs space-y-4"><h2 class="text-lg font-bold">結案中心</h2><p class="text-xs text-stone-500">PDF 結案報告與歸檔。</p></div>`;
            }
        }
        // 控制手機版側邊欄開關的函式
        function toggleMobileSidebar() {
            const sidebar = document.querySelector('.ruili-sidebar');
            sidebar.classList.toggle('mobile-open');
        }
    </script>
</body>
</html>
